# Build and attach release assets when a version tag is pushed.
#
# BRAT and the community-plugin installer fetch manifest.json, main.js and
# styles.css from the release; the worker bundle and ONNX runtime files are
# attached as extra assets and self-healed by the plugin on first run (see
# src/assets.ts — the tag name must equal manifest.json's version, which is
# what assetUrl() reconstructs).
name: Release
on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Verify tag matches manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != manifest $v"; exit 1; }
      - name: Create release with assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            manifest.json
            main.js
            styles.css
            index-worker.js
            ort-wasm-simd-threaded.asyncify.mjs
            ort-wasm-simd-threaded.asyncify.wasm
